<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic To-Do List</title>
    <link rel="stylesheet" href="main.css">
    <script type="text/javascript" src="tasks.json"></script>
    <script type="text/javascript" src="app.js"></script>
</head>
<body>
    
    <div class="spinner-fullscreen" id="spinner-fullscreen">
        <div class="spinner"></div>
    </div>

   <div  class="container">
        <div class="app-header">
            <h1 id="greeting"></h1>
            <span class="sync-status hidden" id="sync-status"></span>
            <div>
                <button id="openModal" class="primary-btn">+ Add Task</button>
                <button id="open-settings-modal" class="primary-btn">Cloud Saving Settings</button>
            </div>
        </div>

        <div class="task-container" id="task-list"></div>

        <dialog id="modal" class="modal">
            <div class="modal-content">
                <form id="add-task-form">
                    <h2>Enter a new task</h2>

                    <div class="form-group">
                        <label for="task-name">Task Name:</label>
                        <input type="text" name="task-name" id="task-name" placeholder="What do you have to do?" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Task Priority:</label>
                        <div class="priority-options" id="task-priority">
                            <button type="button" class="selection-btn priority-btn" id="Low">Low</button>
                            <button type="button" class="selection-btn priority-btn" id="Medium">Medium</button>
                            <button type="button" class="selection-btn priority-btn" id="High">High</button>
                            <button type="button" class="selection-btn priority-btn custom-priority" id="Custom">Customize</button>
                        </div>
                        <input type="text" id="custom-priority" class="custom-input" placeholder="How important?">
                    </div>

                    <div class="form-group">
                        <label>Task Duration:</label>
                        <div class="duration-options">
                            <button type="button" class="selection-btn duration-btn" data-duration="15">15 min</button>
                            <button type="button" class="selection-btn duration-btn" data-duration="30">30 min</button>
                            <button type="button" class="selection-btn duration-btn" data-duration="60">1 h</button>
                            <button type="button" class="selection-btn duration-btn" data-duration="120">2 h</button>
                            <button type="button" class="selection-btn duration-btn custom-duration">Customize</button>
                        </div>
                        <input type="number" id="custom-time" class="custom-input" placeholder="How long?">
                    </div>

                    <div class="modal-actions">
                        <button type="button" id="closeModal" class="secondary-btn">Cancel</button>
                        <input type="submit" value="Save Task" id="save-task" class="primary-btn">
                    </div>
                </form>
            </div>
        </dialog>

        <dialog class="focus-modal" id="focus-modal">
            <div class="focus-container">
                <div class="focus-mode-info">
                    <h2 id="working-task-name" class="working-task-name">Task name</h2>
                    <div id="working-task-time" class="working-task-time">00:00</div>
                </div>
                <div class="focus-mode-controls">
                    <button id="stop-timer-btn" class="stop-timer-btn">Stop Timer</button>
                    <button id="finish-btn" class="finish-btn">Finish task</button>
                </div>
            </div>
        </dialog>

        <dialog class="modal" id="settings-modal">
            <div class="modal-content">
                <form id="submit-settings-btn">
                    <h2>Cloud Saving Settings</h2>
                    <p class="tutorial">Tutorial for getting a <a href="https://dev.to/warnerbell/how-to-generate-a-github-personal-access-token-pat-1bg5" target="_blank">Github PAT</a></p>
                    <p class="tutorial">Tutorial for getting a <a href="https://docs.github.com/en/enterprise-server@3.17/get-started/writing-on-github/editing-and-sharing-content-with-gists/creating-gists" target="_blank">Github Gist ID</a></p>
                    <h6>Warning: The current tasks will be deleted!</h6>
                    <div class="input-settings">
                        <div class="form-group" style="margin-top: 15px;">
                            <label for="github-PAT">Enter your Github Personal Access Token (PAT):</label>
                            <input type="password" name="github-PAT" id="github-PAT" placeholder="ghp_...">
                        </div>
                        <div class="form-group">
                            <label for="github-gist-id">Enter your Github Gist ID: </label>
                            <input type="text" name="github-gist-id" id="github-gist-id" placeholder="Gist ID">
                        </div>
                        <div class="modal-actions">
                            <button type="button" class="secondary-btn" id="close-settings-modal-btn">Cancel</button>
                            <input type="submit" class="primary-btn" value="Submit">
                        </div>
                    </div>
                </form>
            </div>
        </dialog>
   </div>

</body>
</html>
